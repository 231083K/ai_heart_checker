<!DOCTYPE html><html lang="ja"><head><title>新規登録</title><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background-color:#f0f2f5;}.login-box{background:white;padding:2em;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.1);width:300px;}h1{text-align:center;}form div{margin-bottom:1em;}label{display:block;margin-bottom:0.5em;}input{width:100%;padding:0.5em;box-sizing:border-box;}button{width:100%;padding:0.7em;background-color:#28a745;color:white;border:none;border-radius:5px;cursor:pointer;}p{font-size:0.9em;text-align:center;}</style></head><body><div class="login-box"><h1>新規登録</h1><form action="/register" method="post"><div><label for="username">ユーザー名:</label><input type="text" id="username" name="username" required></div><div><label for="password">パスワード:</label><input type="password" id="password" name="password" required></div><button type="submit">登録</button></form><p>すでにアカウントをお持ちですか？ <a href="/login">ログイン</a></p></div></body></html>
