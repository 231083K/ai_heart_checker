<!DOCTYPE html><html lang="ja"><head><title>新規登録</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head><body><div class="container" style="max-width: 400px; margin-top: 5em;"><div class="form-box"><h1>新規登録</h1>{% if error %}<p class="error-message">{{ error }}</p>{% endif %}<form action="/register" method="post"><div><label for="username">ユーザー名:</label><input type="text" id="username" name="username" required></div><div><label for="password">パスワード:</label><input type="password" id="password" name="password" required></div><div><label for="password_confirm">パスワード（確認用）:</label><input type="password" id="password_confirm" name="password_confirm" required></div><button type="submit" style="background-color:#28a745;">登録</button></form><p style="text-align:center; margin-top:1em;">すでにアカウントをお持ちですか？ <a href="/login">ログイン</a></p></div></div></body></html>
