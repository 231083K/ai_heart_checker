{% extends "base.html" %}

{% block title %}ホーム - {{ super() }}{% endblock %}

{% block content %}
<div class="content-box">
    <h2>心電図データをアップロード</h2>
    <p>診断したいレコードの .dat と .hea ファイルのペア、または 'signal' 列を持つ単一の .csv ファイルを選択してください。</p>
    <form action="/diagnose" method="post" enctype="multipart/form-data">
        <input type="file" name="files" multiple required accept=".dat,.hea,.csv">
        <button type="submit">診断を開始</button>
    </form>
</div>
{% endblock %}
