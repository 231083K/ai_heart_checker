<!DOCTYPE html><html lang="ja"><head><title>ログイン</title><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}"></head><body><div class="container" style="max-width: 400px; margin-top: 5em;"><div class="form-box"><h1>ログイン</h1>{% if error %}<p style="color:var(--risk-high);">{{ error }}</p>{% endif %}<form action="/token" method="post"><div><label for="username">ユーザー名:</label><input type="text" id="username" name="username" required></div><div><label for="password">パスワード:</label><input type="password" id="password" name="password" required></div><button type="submit">ログイン</button></form><p style="text-align:center; margin-top:1em;">アカウントがありませんか？ <a href="/register">新規登録</a></p></div></div></body></html>
